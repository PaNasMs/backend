name: Build PaNasMs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: PaNasMs/panasms/.github/workflows/build.yml@f5bb6fe65e2c240c479423a50769c2023d523014
    with:
      build_ref: f5bb6fe65e2c240c479423a50769c2023d523014
      backend_ref: ${{ github.sha }}
