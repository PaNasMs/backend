name: Build PaNasMs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: PaNasMs/panasms/.github/workflows/build.yml@148c1ce89a194a4f50aef2b699be3b717b026572
    with:
      build_ref: 148c1ce89a194a4f50aef2b699be3b717b026572
      backend_ref: ${{ github.sha }}
