name: Build PaNasMs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: PaNasMs/panasms/.github/workflows/build.yml@442eed4a432002744d3729c69edadfab6ec85c25
    with:
      build_ref: 442eed4a432002744d3729c69edadfab6ec85c25
      backend_ref: ${{ github.sha }}
      paired_ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
