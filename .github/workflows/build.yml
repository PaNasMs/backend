name: Build PaNasMs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: PaNasMs/panasms/.github/workflows/build.yml@3ffc027cd8e5a5899d3d54ffa314248f963d6a33
    with:
      build_ref: 3ffc027cd8e5a5899d3d54ffa314248f963d6a33
      backend_ref: ${{ github.sha }}
