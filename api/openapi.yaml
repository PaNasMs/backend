          type: integer
        startDate:
          type: string
      required:
      - test
      - weekday
      - hour
    MediaInfo:
      type: object
      properties:
        kind:
          type: string
        readOnly:
          type: boolean
        name:
          type: string
        manufacturerId:
          type: string
        manufactured:
          type: string
        revision:
          type: string
        usbId:
          type: string
        usbVersion:
          type: string
        linkMbps:
          type: string
        manufacturer:
          type: string
      required:
      - kind
      - readOnly
    StorageOptionDevice:
      type: object
      properties:
        path:
          type: string
        kname:
          type: string
        type:
          type: string
        size:
          type: integer
        fstype:
          anyOf:
          - type: string
          - type: 'null'
        uuid:
          anyOf:
          - type: string
          - type: 'null'
        mountpoints:
          type: array
          items:
            anyOf:
            - type: string
            - type: 'null'
        smartSchedules:
          type: array
          items:
            $ref: '#/components/schemas/SmartSchedule'
        smartSchedule:
          anyOf:
          - $ref: '#/components/schemas/SmartSchedule'
          - type: 'null'
        media:
          $ref: '#/components/schemas/MediaInfo'
        mountSettings:
          anyOf:
          - type: object
            properties:
              point:
                type: string
              automount:
                type: boolean
              readOnly:
                type: boolean
            required:
            - point
            - automount
            - readOnly
          - type: 'null'
        protectedReason:
          type: string
        busyReason:
          type: string
        raidReason:
          type: string
        raidEligible:
          type: boolean
        ejectable:
          type: boolean
        filesystemHealth:
          anyOf:
          - type: object
            additionalProperties: {}
          - type: 'null'
      required:
      - path
      - kname
      - protectedReason
      - busyReason
      - raidReason
      - raidEligible
      - ejectable
    StorageOptions:
      type: object
      properties:
        sleepSettings:
          type: object
          properties:
            minutes:
              type: integer
          required:
          - minutes
        sleepStatus:
          type: object
          additionalProperties:
            type: object
            properties:
              device:
                type: string
              minutes:
                anyOf:
                - type: integer
                - type: 'null'
              status:
                type: string
              error:
                type: string
            required:
            - device
            - minutes
            - status
        devices:
          type: array
          items:
            $ref: '#/components/schemas/StorageOptionDevice'
        formats:
          type: array
          items:
            type: string
        capabilities:
          type: object
          additionalProperties:
            type: object
            properties:
              create:
                type: boolean
              grow:
                type: boolean
              shrink:
                type: boolean
              resizeRequiresMount:
                type: boolean
              resizeRequiresUnmount:
                type: boolean
            required:
            - create
            - grow
            - shrink
      required:
      - sleepSettings
      - sleepStatus
      - devices
      - formats
      - capabilities
    RaidCandidates:
      type: object
      properties:
        devices:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              kname:
                type: string
              type:
                type: string
              size:
                type: integer
            required:
            - path
            - kname
            - type
            - size
      required:
      - devices
    SmartReport:
      type: object
      additionalProperties: {}
      description: Native smartctl JSON report, versioned by smartctl (json_format_version).
        Keys vary by SATA/NVMe/USB support; absence is not health success.
      properties:
        json_format_version:
          type: array
          items:
            type: integer
        smartctl:
          type: object
          additionalProperties: {}
        device:
          type: object
          additionalProperties: {}
        temperature:
          type: object
          properties:
            current:
              type: number
          required: []
        smart_status:
          type: object
          properties:
            passed:
              type: boolean
          required: []
      required:
      - json_format_version
      - smartctl
    ManagementViews:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/ManagementJob'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ManagementJob'
        accounts:
          $ref: '#/components/schemas/AccountInventory'
        account-details:
          $ref: '#/components/schemas/ManagedAccount'
        account-sessions:
          type: array
          items:
            $ref: '#/components/schemas/SSHSession'
        homes:
          $ref: '#/components/schemas/HomeLocations'
        homes-check:
          $ref: '#/components/schemas/HomePreflight'
        sharing:
          $ref: '#/components/schemas/ShareInventory'
        share-folders:
          $ref: '#/components/schemas/FolderLocations'
        home-folders:
          $ref: '#/components/schemas/FolderLocations'
        mount-folders:
          $ref: '#/components/schemas/FolderLocations'
        modules:
          $ref: '#/components/schemas/InstalledModules'
        module-sources:
          $ref: '#/components/schemas/ModuleSources'
        module-catalog:
          $ref: '#/components/schemas/ModuleCatalog'
        web-access:
          $ref: '#/components/schemas/WebAccess'
        system-updates:
          $ref: '#/components/schemas/SystemUpdates'
        network:
          $ref: '#/components/schemas/NetworkView'
        storage-options:
          $ref: '#/components/schemas/StorageOptions'
        raid-candidates:
          $ref: '#/components/schemas/RaidCandidates'
        smart:
          $ref: '#/components/schemas/SmartReport'
        services:
          $ref: '#/components/schemas/ServicesView'
        journal:
          $ref: '#/components/schemas/JournalView'
        updates:
          $ref: '#/components/schemas/PackageUpdates'
        nfs:
          $ref: '#/components/schemas/NFSExports'
        power:
          $ref: '#/components/schemas/PowerState'
      required: []
      description: Query-name to response-schema map. Each GET response is the value for
        the selected view, not this mapping object. Installed modules own additional query
        contracts.

    Notification:
      type: object
      required: [id, message, severity, active, created, updated]
      properties:
        id: {type: string}
        message: {type: string}
        severity: {type: string, enum: [info, success, warning, error]}
        active: {type: boolean}
        created: {type: string}
        updated: {type: string}
    EventEnvelope:
      oneOf:
      - type: object
        required: [version, type, data]
        properties:
          version: {const: 1}
          type: {enum: [resync, storage.changed, jobs.changed, notifications.changed, cooling.unavailable, metrics.unavailable]}
          data: {type: 'null'}
      - type: object
        required: [version, type, data]
        properties:
          version: {const: 1}
          type: {const: metrics}
          data: {$ref: '#/components/schemas/Metrics'}
      - type: object
        required: [version, type, data]
        properties:
          version: {const: 1}
          type: {const: cooling}
          data: {$ref: '#/components/schemas/CoolingState'}
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: panasms_session
