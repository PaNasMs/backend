openapi: 3.1.0
info:
  title: PaNasMs prototype API
  version: 0.2.6
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/login:
    post:
      operationId: postLogin
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      parameters:
      - name: X-PaNasMs-Request
        in: header
        required: true
        schema:
          type: string
          const: '1'
  /api/v1/sessions:
    get:
      operationId: getSessions
      description: Active panel sessions for the caller; administrators may select another user.
      parameters:
      - {name: user, in: query, schema: {type: string}}
      responses:
        '200':
          description: Active sessions, with opaque public IDs and no session tokens.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PanelSession'}}
    post:
      operationId: endSession
      description: End an owned session, or another user's session as administrator. Requires the standard request-origin headers.
      parameters:
      - {name: user, in: query, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [id], properties: {id: {type: string}}}
      responses:
        '204': {description: Session ended}
        '403': {description: Another user's session is not accessible}
        '409': {description: Session already ended}
  /api/v1/security-history:
    get:
      operationId: getSecurityHistory
      description: Latest 100 security events for the caller, or a selected user for administrators.
      parameters:
      - {name: user, in: query, schema: {type: string}}
      responses:
        '200':
          description: Account history without credentials or key material.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AccountEvent'}}
  /api/v1/avatar:
    get:
      operationId: getAvatar
      responses:
        '200':
          description: Current user's avatar version, empty when absent.
          content:
            application/json:
              schema: {type: object, properties: {version: {type: string}}}
    put:
      operationId: putAvatar
      description: Upload JPEG/PNG, at most 2 MiB and 4 megapixels. Stored as a 128px square JPEG.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {description: Avatar saved}
        '400': {description: Invalid image}
        '413': {description: Upload too large}
    delete:
      operationId: deleteAvatar
      responses:
        '200': {description: Own avatar removed}
  /api/v1/avatar/image:
    get:
      operationId: getAvatarImage
      responses:
        '200':
          description: Current user's avatar.
          content:
            image/jpeg: {schema: {type: string, format: binary}}
        '404': {description: No avatar}
  /api/v1/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
  /api/v1/users:
    get:
      operationId: getUsers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accounts'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
  /api/v1/storage:
    get:
      operationId: getStorage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storage'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
  /api/v1/metrics:
    get:
      operationId: getMetrics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
  /api/v1/wallpaper:
    get:
      operationId: getWallpaper
      security:
      - session: []
      responses:
        '200':
          description: Current wallpaper revision, empty when unset
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: putWallpaper
      security:
      - session: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Current wallpaper revision, empty when unset
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteWallpaper
      security:
      - session: []
      responses:
        '200':
          description: Current wallpaper revision, empty when unset
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/wallpaper/image:
    get:
      operationId: getWallpaperImage
      security:
      - session: []
      responses:
        '200':
          description: Current user's wallpaper
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: No wallpaper
  /api/v1/preferences:
    get:
      operationId: getPreferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
    put:
      operationId: putPreferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      parameters:
      - name: X-PaNasMs-Request
        in: header
        required: true
        schema:
          type: string
          const: '1'
  /api/v1/logout:
    post:
      operationId: postLogout
      responses:
        '204':
          description: Success
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - session: []
      parameters:
      - name: X-PaNasMs-Request
        in: header
        required: true
        schema:
          type: string
          const: '1'
  /api/v1/cooling:
    get:
      operationId: getCooling
      security:
      - session: []
      responses: &id001
        '200':
          description: Cooling settings and last observed controller state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoolingState'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: setCooling
      security:
      - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoolingSettings'
      responses: *id001
  /api/v1/profile:
    get:
      operationId: getProfile
      security:
      - session: []
      responses:
        '200':
          description: Own Linux profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default: &id002
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: updateProfile
      security:
      - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '204':
          description: Updated; password change revokes panel sessions
        default: *id002
  /api/v1/manage:
    get:
      summary: Read an authorized management snapshot
      description: ManagementViews maps each core view to its response schema. Ordinary
        users are restricted to their own account/session/jobs and authorized module
        views. Domain validation errors use Error with HTTP 200 for compatibility. Unknown
        views never execute mutations.
      parameters:
      - in: query
        name: view
        required: true
        schema:
          type: string
        description: 'Core views: job, jobs, accounts, account-details, account-sessions,
          homes, homes-check, sharing, share-folders, home-folders, mount-folders, modules,
          module-sources, module-catalog, web-access, system-updates, network, storage-options,
          raid-candidates, smart, services, journal, updates, nfs, power. Additional
          module queries require an enabled module.'
      - in: query
        name: target
        schema:
          type: string
      responses:
        '200':
          description: Selected core snapshot, module-owned JSON response, or domain
            error
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ManagementJob'
                - type: array
                  items:
                    $ref: '#/components/schemas/ManagementJob'
                - $ref: '#/components/schemas/AccountInventory'
                - $ref: '#/components/schemas/ManagedAccount'
                - type: array
                  items:
                    $ref: '#/components/schemas/SSHSession'
                - $ref: '#/components/schemas/HomeLocations'
                - $ref: '#/components/schemas/HomePreflight'
                - $ref: '#/components/schemas/ShareInventory'
                - $ref: '#/components/schemas/FolderLocations'
                - $ref: '#/components/schemas/FolderLocations'
                - $ref: '#/components/schemas/FolderLocations'
                - $ref: '#/components/schemas/InstalledModules'
                - $ref: '#/components/schemas/ModuleSources'
                - $ref: '#/components/schemas/ModuleCatalog'
                - $ref: '#/components/schemas/WebAccess'
                - $ref: '#/components/schemas/SystemUpdates'
                - $ref: '#/components/schemas/NetworkView'
                - $ref: '#/components/schemas/StorageOptions'
                - $ref: '#/components/schemas/RaidCandidates'
                - $ref: '#/components/schemas/SmartReport'
                - $ref: '#/components/schemas/ServicesView'
                - $ref: '#/components/schemas/JournalView'
                - $ref: '#/components/schemas/PackageUpdates'
                - $ref: '#/components/schemas/NFSExports'
                - $ref: '#/components/schemas/PowerState'
                - $ref: '#/components/schemas/Error'
                - type: object
                  additionalProperties: {}
                  description: Installed module response, defined by its own API contract.
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: System handler or task journal unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Preview, submit, cancel, inspect or acknowledge an operation
      description: plan requires action/params and returns OperationPlan or Error; run
        requires id/action/params/fingerprint/confirmation and returns JobAccepted.
        cancel/recover/acknowledge require id; clear-history accepts {}. Queued work
        is not replayed after restart. Cancellation is cooperative, never a kill request.
        IDs must be unique per logical submission; retry uncertain submissions with
        the same ID.
      parameters:
      - in: query
        name: view
        required: true
        schema:
          type: string
          enum:
          - plan
          - run
          - cancel
          - recover
          - acknowledge
          - clear-history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementRequest'
      responses:
        '200':
          description: Plan, existing job ID, recovery report, acknowledgement or domain
            error
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/OperationPlan'
                - $ref: '#/components/schemas/JobAccepted'
                - $ref: '#/components/schemas/JobRecovery'
                - $ref: '#/components/schemas/OperationOK'
                - $ref: '#/components/schemas/Error'
        '202':
          description: Durably accepted job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          description: Invalid request or mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale state or task conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Queue full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Handler or journal unavailable; reconcile by ID before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/metrics/history:
    get:
      parameters:
      - {in: query, name: hours, schema: {type: integer, minimum: 1, maximum: 168, default: 24}}
      responses:
        '200':
          description: One recorded sample per minute; gaps are retained
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Metrics'}}
  /api/v1/notifications:
    get:
      responses:
        '200':
          description: Persistent alerts; an ordinary user receives an empty list
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Notification'}}
    delete:
      summary: Dismiss resolved history for the caller; active warnings remain
      parameters:
      - {in: query, name: id, schema: {type: string}, description: Omit to dismiss all resolved history}
      responses:
        '204': {description: History cleared}
        '403': {description: Administrator required}
  /api/v1/terminal:
    get:
      responses:
        '101': {description: Admin user PTY WebSocket; input/resize JSON in, binary terminal bytes out}
  /api/v1/files/content:
    get:
      parameters:
      - {in: query, name: target, required: true, schema: {type: string}}
      - {in: query, name: thumbnail, required: false, schema: {type: string, enum: ['1']}, description: Return a bounded JPEG image thumbnail instead of the original file}
      responses:
        '200': {description: File attachment or image/jpeg thumbnail under caller Linux UID/GID; no-store}
        '403': {description: Access denied or thumbnail unavailable}
        '503': {description: Thumbnail generation timed out or service unavailable}
    put:
      parameters:
      - {in: query, name: target, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Entire upload atomically published; existing files are never overwritten}
        '409': {description: File exists, permission denied or transfer failed}

  /api/v1/events:
    get:
      summary: Authenticated same-origin WebSocket invalidations
      description: Server messages match EventEnvelope. Reread HTTP snapshots after resync/reconnect; there is no replay cursor. No commands are accepted. Slow clients disconnect; revoked sessions close with code 1008.
      responses:
        '101': {description: WebSocket established}
        '401': {description: Sign-in required}
        '403': {description: Invalid origin}
  /api/v1/modules/upload:
    post:
      summary: Upload a module bundle for inspection before installation
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, description: Maximum 128 MiB}
      responses:
        '200': {description: Staged archive reference for module.install preview}
        '403': {description: Administrator required}
        '503': {description: Agent unavailable}
  /api/v1/module-assets/{module}/{asset}:
    get:
      summary: Read a manifest-listed UI asset from an enabled module
      parameters:
      - {in: path, name: module, required: true, schema: {type: string}}
      - {in: path, name: asset, required: true, schema: {type: string}, description: Relative asset path, potentially containing slashes}
      responses:
        '200': {description: Asset with its native content type and no-store policy}
        '404': {description: Module disabled or asset not listed in its signed manifest}

components:
  schemas:
    JobRecovery:
      type: object
      required: [message, checks, route]
      properties:
        message: {type: string}
        checks:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: {type: string}
              value: {}
        route: {type: string}
        recoveryAction: {type: [string, 'null'], description: An explicit action requiring a fresh preview and confirmation}
    ManagementJob:
      type: object
      required: [id, user, action, target, status, stage, created, updated, result, canCancel, cancelRequested, needsReview]
      properties:
        id: {type: string}
        user: {type: string}
        action: {type: string}
        target: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted]}
        stage: {type: string}
        created: {type: string}
        updated: {type: string}
        result: {type: object, additionalProperties: true}
        canCancel: {type: boolean, description: Cancellation is currently supported at a safe checkpoint}
        cancelRequested: {type: boolean}
        needsReview: {type: boolean, description: Unreviewed terminal tasks are retained when history is cleared}
        recovery: {$ref: '#/components/schemas/JobRecovery'}
    Identity:
      type: object
      required:
      - username
      - name
      - uid
      - role
      properties:
        username:
          type: string
        name:
          type: string
        uid:
          type: integer
        role:
          type: string
        smbSyncWarning:
          type: boolean
          description: Linux login succeeded but Samba password synchronization needs attention.
    User:
      type: object
      required:
      - username
      - name
      - uid
      - gid
      - home
      - shell
      - category
      - groups
      properties:
        username:
          type: string
        name:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        home:
          type: string
        shell:
          type: string
        category:
          type: string
        groups:
          type: array
          items:
            type: string
    Group:
      type: object
      required:
      - name
      - gid
      - members
      properties:
        name:
          type: string
        gid:
          type: integer
        members:
          type: array
          items:
            type: string
    PanelSession:
      type: object
      required: [id, user, address, device, created, expires, current, kind]
      properties:
        id: {type: string}
        user: {type: string}
        address: {type: string}
        device: {type: string}
        created: {type: integer, description: Unix timestamp in seconds}
        expires: {type: integer}
        current: {type: boolean}
        kind: {type: string, const: panel}
    AccountEvent:
      type: object
      required: [user, actor, action, result, created]
      properties:
        user: {type: string}
        actor: {type: string}
        action: {type: string}
        result: {type: string}
        created: {type: string, format: date-time}
    Accounts:
      type: object
      required:
      - users
      - groups
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
    Metrics:
      type: object
      required:
      - systemTotal
      - systemAvailable
      - disks
      - network
      - hostname
      - cpu
      - memoryTotal
      - memoryUsed
      - uptime
      - cpuTemperature
      - observedAt
      - cpuFanRpm
      properties:
        systemTotal: {type: integer}
        systemAvailable: {type: integer}
        disks:
          type: object
          additionalProperties:
            type: object
            required: [read, write]
            properties:
              read: {type: number}
              write: {type: number}
        network:
          type: object
          additionalProperties:
            type: object
            required: [read, write]
            properties:
              read: {type: number}
              write: {type: number}

        hostname:
          type: string
        cpu:
          type:
          - number
          - 'null'
        memoryTotal:
          type: number
        memoryUsed:
          type: number
        uptime:
          type: number
        cpuTemperature:
          type:
          - number
          - 'null'
        observedAt:
          type: string
        cpuFanPercent:
          description: Fan PWM duty as a percentage; null when unavailable.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        cpuFanRpm:
          type:
          - integer
          - 'null'
    Array:
      type: object
      required:
      - name
      - level
      - state
      - degraded
      - members
      - sync
      - progress
      - device
      - uuid
      - size
      properties:
        missing:
          type: integer
        memberStates:
          type: object
          additionalProperties:
            type: string
        reshapePending:
          type: boolean
        syncPercent:
          type: number
        syncSpeed:
          type: number
        syncRemaining:
          type: number
        name:
          type: string
        level:
          type: string
        state:
          type: string
        degraded:
          type: string
        members:
          type: array
          items:
            type: string
        sync:
          type: string
        progress:
          type: string
        device:
          type: string
        uuid:
          type: string
        size:
          type: number
    Preferences:
      type: object
      required:
      - theme
      - layouts
      properties:
        language:
          type: string
          enum: [en, ru, uk]
          default: en
          description: Personal interface language; English is the default and fallback.
        taskbar:
          type: array
          items:
            type: string
          maxItems: 8
          uniqueItems: true
        desktopLayouts:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [id, kind, x, y]
              properties:
                id: {type: string}
                kind: {type: string}
                x: {type: integer}
                y: {type: integer}

        smartCrcBaselines:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        theme:
          type: string
          enum:
          - dark
          - light
        layouts:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Login:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
        newPassword:
          type: string
          description: Required only after a 409 password-change-required response.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
        version:
          type: string
    Device:
      type: object
      required:
      - name
      - kname
      - path
      - type
      - size
      properties:
        name:
          type: string
        kname:
          type: string
        path:
          type: string
        type:
          type: string
        size:
          type: number
        model: &id003
          type:
          - string
          - 'null'
        serial: *id003
        tran: *id003
        fstype: *id003
        uuid: *id003
        pkname: *id003
        rota:
          type: boolean
        mountpoints:
